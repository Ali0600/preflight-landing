# Dependency pre-flight — this repo is the first external consumer of the published Action.
# PRs: diffs the dependency tree and fails on newly-introduced CVEs.
# Manual dispatch: scans the committed manifest (repo mode) into a tracking issue.
name: Preflight
on:
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: Ali0600/preflight@v1
        with:
          # repo mode when run manually; PR mode (default) on pull requests
          mode: ${{ github.event_name == 'workflow_dispatch' && 'repo' || 'pr' }}
          # Manual repo scans are report-only (they'd stay red on the one adjudicated,
          # Next-pinned postcss advisory — see issue #1). PRs still fail on anything NEW.
          fail-on-cve: ${{ github.event_name == 'workflow_dispatch' && 'false' || 'true' }}
